<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grip — Your tasks. Your clips. All in one place." />
    <title>Grip</title>
    <!-- Apply saved theme, UI style and layout before first paint (avoids a flash of
         the wrong look). Keep the allowed values in sync with src/hooks/useTheme.ts -->
    <script>
      (function () {
        var d = document.documentElement;
        var theme = 'light';
        var style = 'classic';
        var layout = 'focused';
        try {
          var t = localStorage.getItem('theme');
          theme = t === 'light' || t === 'dark'
            ? t
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var s = localStorage.getItem('uiStyle');
          if (s === 'glass' || s === 'tactile') style = s;
          var l = localStorage.getItem('uiLayout');
          if (l === 'wide' || l === 'sidebar' || l === 'bento') layout = l;
        } catch (e) {}
        d.setAttribute('data-theme', theme);
        d.setAttribute('data-style', style);
        d.setAttribute('data-layout', layout);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
