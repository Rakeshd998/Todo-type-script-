<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grip — Your tasks. Your clips. All in one place." />
    <title>Grip</title>
    <!-- Apply saved theme + UI style before first paint (avoids a flash of the wrong look).
         Keep in sync with src/hooks/useTheme.ts -->
    <script>
      (function () {
        var d = document.documentElement;
        var theme = 'light';
        var style = 'classic';
        try {
          var t = localStorage.getItem('theme');
          theme = t === 'light' || t === 'dark'
            ? t
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (localStorage.getItem('uiStyle') === 'glass') style = 'glass';
        } catch (e) {}
        d.setAttribute('data-theme', theme);
        d.setAttribute('data-style', style);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
