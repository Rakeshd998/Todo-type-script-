<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#1a0a3a"/>
    </linearGradient>
    <linearGradient id="grip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Grip fingers (simplified fist/grip shape) -->
  <g fill="url(#grip)" filter="url(#glow)">
    <!-- Palm -->
    <rect x="30" y="52" width="40" height="26" rx="8"/>
    <!-- Fingers -->
    <rect x="30" y="28" width="9" height="28" rx="5"/>
    <rect x="41" y="24" width="9" height="32" rx="5"/>
    <rect x="52" y="24" width="9" height="32" rx="5"/>
    <rect x="63" y="28" width="9" height="28" rx="5"/>
    <!-- Thumb hint -->
    <rect x="20" y="46" width="12" height="18" rx="6"/>
  </g>
</svg>